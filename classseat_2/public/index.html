<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>자리배치</title>
<style>
  :root {
    --board: #1f3a2e;
    --board-light: #2b4d3c;
    --chalk: #f4f1e6;
    --chalk-dim: #cdd6cc;
    --accent: #e8c15a;
    --accent-dim: #b99a3f;
    --danger: #d97164;
    --line: rgba(244, 241, 230, 0.16);
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--board);
    color: var(--chalk);
    font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.55;
  }
  #app { max-width: 960px; margin: 0 auto; padding: 40px 20px 80px; }

  h1, h2, h3 { font-weight: 600; letter-spacing: -0.01em; margin: 0 0 6px; }
  h1 { font-size: 26px; }
  h2 { font-size: 19px; }
  h3 { font-size: 15px; color: var(--chalk-dim); font-weight: 500; }
  p { color: var(--chalk-dim); }
  .muted { color: var(--chalk-dim); font-size: 13px; }

  .card {
    background: var(--board-light);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }

  label { display: block; font-size: 13px; color: var(--chalk-dim); margin: 14px 0 5px; }
  input, select, textarea {
    width: 100%;
    padding: 9px 11px;
    background: rgba(0,0,0,0.18);
    border: 1px solid var(--line);
    color: var(--chalk);
    border-radius: var(--radius);
    font-size: 14px;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent-dim);
  }
  textarea { resize: vertical; min-height: 60px; }

  button {
    font-family: inherit;
    font-size: 14px;
    border: none;
    border-radius: var(--radius);
    padding: 10px 18px;
    cursor: pointer;
    background: var(--accent);
    color: #1a1a12;
    font-weight: 600;
  }
  button:hover { background: #f0cd6d; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--chalk);
    font-weight: 500;
  }
  button.secondary:hover { border-color: var(--chalk-dim); }
  button.danger { background: var(--danger); color: #2a0d0a; }
  button.link { background: none; padding: 0; color: var(--accent); font-weight: 500; text-decoration: underline; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .tabs button { background: transparent; color: var(--chalk-dim); border: 1px solid var(--line); }
  .tabs button.active { background: var(--accent); color: #1a1a12; border-color: var(--accent); }

  .error { color: var(--danger); font-size: 13px; margin-top: 8px; }
  .success { color: #8fd0a5; font-size: 13px; margin-top: 8px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--chalk-dim); font-weight: 500; }

  .class-list { display: flex; flex-direction: column; gap: 8px; }
  .class-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; background: rgba(0,0,0,0.14); border-radius: var(--radius);
    cursor: pointer; border: 1px solid transparent;
  }
  .class-item:hover { border-color: var(--line); }

  .seat-grid { display: grid; gap: 6px; margin: 16px 0; }
  .seat {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-size: 12px;
    text-align: center;
    padding: 4px;
  }
  .seat.aisle { background: transparent; border: none; }
  .seat.aircon { border-color: var(--accent-dim); }
  .seat .name { font-weight: 600; font-size: 13px; }
  .seat .num { color: var(--chalk-dim); font-size: 10px; }

  .weight-row { display: grid; grid-template-columns: 110px 1fr 40px; gap: 10px; align-items: center; margin-bottom: 8px; }
  .weight-row input[type=range] { width: 100%; }
  .weight-row span { text-align: right; font-size: 13px; color: var(--chalk-dim); }

  .pin-table td:last-child { font-family: monospace; letter-spacing: 0.05em; color: var(--accent); }

  a.back { color: var(--chalk-dim); font-size: 13px; text-decoration: none; }
  a.back:hover { color: var(--chalk); }

  .score-badge {
    display: inline-block; background: rgba(232,193,90,0.15); color: var(--accent);
    padding: 3px 10px; border-radius: 20px; font-size: 13px; font-weight: 600;
  }

  .map { margin: 12px 0; }
  .board-label {
    text-align: center; font-size: 12px; letter-spacing: 0.3em; color: var(--chalk-dim);
    background: rgba(0,0,0,0.25); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 5px 0; margin-bottom: 8px;
  }
  .map .seat-grid { margin: 0; }
  .seat.selectable { cursor: pointer; }
  .seat.selectable:hover { border-color: var(--accent); }
  .seat.selected { background: rgba(232,193,90,0.28); border-color: var(--accent); }
  .seat.fixed { background: rgba(143,208,165,0.18); border-color: #8fd0a5; }
  .seat.dragover { background: rgba(232,193,90,0.2); border-style: dashed; border-color: var(--accent); }
  .seat.aisle.editable { border: 1px dashed var(--line); cursor: pointer; }
  .seat[draggable="true"] { cursor: grab; }

  .col-tools { display: grid; gap: 6px; margin-bottom: 6px; }
  button.tiny { padding: 4px 6px; font-size: 11px; }
  button.secondary.on { border-color: var(--accent); color: var(--accent); }

  .chip {
    display: inline-block; padding: 3px 10px; margin: 3px 4px 3px 0; border-radius: 20px;
    background: rgba(217,113,100,0.18); border: 1px solid rgba(217,113,100,0.45); font-size: 13px;
  }
  .bar { height: 6px; background: rgba(0,0,0,0.25); border-radius: 3px; overflow: hidden; margin: 6px 0 10px; }
  .bar > div { height: 100%; background: var(--accent); }
  .warn-box {
    background: rgba(232,193,90,0.12); border: 1px solid var(--accent-dim); border-radius: var(--radius);
    padding: 10px 14px; margin: 10px 0; font-size: 13px;
  }
  .warn-box ul { margin: 6px 0 0; padding-left: 18px; }
  .pair-row, .hist-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px;
  }
  .tag {
    display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 11px;
    border: 1px solid var(--line); color: var(--chalk-dim); margin-left: 6px;
  }
  .tag.cur { color: var(--accent); border-color: var(--accent-dim); }
  .group-title { margin: 16px 0 2px; font-size: 13px; color: var(--accent); font-weight: 600; }
  details.card > summary { cursor: pointer; font-weight: 600; }

</style>
</head>
<body>
<div id="app">불러오는 중...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signOut, onAuthStateChanged, signInWithCustomToken
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc,
  updateDoc, deleteField, query, where, orderBy, limit
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ── Firebase 프로젝트 설정: 본인 프로젝트 값으로 교체하세요 ──
const firebaseConfig = {
  apiKey: "AIzaSyAOKhgT1fHeNs0wIhjc6rcjqCgjcX7FcFk",
  authDomain: "classseat-c7328.firebaseapp.com",
  projectId: "classseat-c7328",
  storageBucket: "classseat-c7328.firebasestorage.app",
  messagingSenderId: "100599928392",
  appId: "1:100599928392:web:af72a41e571def1511aa7d",
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const app = document.getElementById('app');

let _role = null;         // 'teacher' | 'student' | null
let _studentClaims = null; // { classId, number } — 학생 로그인 시 커스텀 클레임 저장

// 가중치 기본값 (lib/firebaseAdmin.js의 DEFAULT_WEIGHTS와 같게 유지)
const DEFAULT_WEIGHTS = { location: 5, seat: 5, aircon: 3, mates: 6, personality: 3, grade: 4, height: 4, activity: 3 };
const WEIGHT_LABELS = [
  ['location', '선호 위치'], ['seat', '선호 좌석'], ['aircon', '에어컨'], ['mates', '선호 짝꿍'],
  ['personality', '성격 균형'], ['grade', '성적 균형'], ['height', '키 순서'], ['activity', '활동성 분산'],
];
const MAX_DIM = 12; // 행/열 최대
const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';

// ── 공통 헬퍼 ──
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

async function api(path, body, idToken) {
  const r = await fetch(path, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      ...(idToken ? { Authorization: 'Bearer ' + idToken } : {}),
    },
    body: JSON.stringify(body || {}),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || '요청에 실패했습니다');
  return data;
}
async function authApi(path, body) {
  const t = await auth.currentUser.getIdToken();
  return api(path, body, t);
}

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

// 메시지 영역(.error / .success) 표시
function setMsg(node, text, kind = 'error') {
  if (!node) return;
  node.className = kind === 'ok' ? 'success' : 'error';
  node.textContent = text || '';
  node.style.display = text ? 'block' : 'none';
}

const fmtTime = (iso) => {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
};

/**
 * 좌석표 그리기 (선생님/학생 화면 공통).
 * opt.cell(cell, i) → { html, cls, title, clickable, draggable, dropTarget }
 * opt.onClick(i, cell), opt.onDrop(fromIndex, toIndex)
 */
function mapEl(cols, grid, opt = {}) {
  const wrap = el(`<div class="map"><div class="board-label">칠판 · 앞</div><div class="seat-grid" style="grid-template-columns: repeat(${cols}, minmax(0, 1fr));"></div></div>`);
  const g = wrap.querySelector('.seat-grid');
  grid.forEach((cell, i) => {
    const d = (opt.cell && opt.cell(cell, i)) || {};
    const isSeat = cell.type === 'seat';
    const div = el(`<div class="seat${isSeat ? '' : ' aisle'}${cell.aircon ? ' aircon' : ''}${d.cls ? ' ' + d.cls : ''}">${d.html || ''}</div>`);
    if (d.title) div.title = d.title;
    if (d.clickable && opt.onClick) {
      div.classList.add('selectable');
      div.onclick = () => opt.onClick(i, cell);
    }
    if (d.draggable && opt.onDrop) {
      div.draggable = true;
      div.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', String(i));
        e.dataTransfer.effectAllowed = 'move';
      });
    }
    if (d.dropTarget && opt.onDrop) {
      div.addEventListener('dragover', (e) => { e.preventDefault(); div.classList.add('dragover'); });
      div.addEventListener('dragleave', () => div.classList.remove('dragover'));
      div.addEventListener('drop', (e) => {
        e.preventDefault();
        div.classList.remove('dragover');
        const from = Number(e.dataTransfer.getData('text/plain'));
        if (!isNaN(from)) opt.onDrop(from, i);
      });
    }
    g.appendChild(div);
  });
  return wrap;
}

// ── 제약조건 정규화: DB에는 [{a,b,level}] 형태로 저장한다 (Firestore는 중첩 배열 불가) ──
const emptyCons = () => ({ blacklist: [], whitelist: [], separate: [], fixedSeats: {} });
function normCons(raw) {
  const r = raw || {};
  const pair = (p) => {
    if (Array.isArray(p)) return p.length >= 2 ? { a: String(p[0]), b: String(p[1]), level: p[2] } : null;
    return p && p.a != null && p.b != null ? { a: String(p.a), b: String(p.b), level: p.level } : null;
  };
  const list = (x) => (Array.isArray(x) ? x : []).map(pair).filter(Boolean);
  return {
    blacklist: list(r.blacklist).map(({ a, b }) => ({ a, b })),
    whitelist: list(r.whitelist).map(({ a, b }) => ({ a, b })),
    separate: list(r.separate).map(({ a, b, level }) => ({ a, b, level: level === 'farthest' ? 'farthest' : 'far' })),
    fixedSeats: { ...(r.fixedSeats || {}) },
  };
}

// 떨어뜨리기 최소 거리 안내용. lib/seatAlgo.js의 sepMinDistance와 같은 공식을 유지할 것.
function seatSpan(grid, cols) {
  let minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
  grid.forEach((cell, i) => {
    if (cell.type !== 'seat') return;
    const r = Math.floor(i / cols), c = i % cols;
    minR = Math.min(minR, r); maxR = Math.max(maxR, r);
    minC = Math.min(minC, c); maxC = Math.max(maxC, c);
  });
  return maxR < 0 ? 0 : Math.max(maxR - minR, maxC - minC);
}
function sepMin(level, span) {
  if (span <= 0) return 0;
  const ratio = level === 'farthest' ? 0.8 : 0.5;
  const floor = level === 'farthest' ? 3 : 2;
  return Math.min(span, Math.max(Math.ceil(span * ratio), floor));
}

// ────────────────────────────────────────────────────────────
// 라우터
// ────────────────────────────────────────────────────────────
function render() {
  if (!auth.currentUser) { renderLanding(); return; }
  if (_role === 'teacher') renderTeacher();
  else if (_role === 'student') renderStudent();
  else renderLanding();
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    _role = null;
    render();
    return;
  }
  // 커스텀 토큰으로 로그인한 학생인지, 일반 이메일 로그인 선생님인지 구분
  const idTokenResult = await user.getIdTokenResult();
  if (idTokenResult.claims.role === 'student') {
    _role = 'student';
    _studentClaims = { classId: idTokenResult.claims.classId, number: idTokenResult.claims.number };
  } else {
    _role = 'teacher';
  }
  render();
});

function showFatal(e) {
  app.innerHTML = '';
  app.appendChild(el(`<div class="card"><h2>문제가 발생했습니다</h2><p class="error">${esc(e && e.message ? e.message : e)}</p><button class="secondary" id="fatalBack">처음으로</button></div>`));
  document.getElementById('fatalBack').onclick = () => render();
}

// ────────────────────────────────────────────────────────────
// 랜딩 — 선생님/학생 선택
// ────────────────────────────────────────────────────────────
function renderLanding() {
  app.innerHTML = '';
  app.appendChild(el(`
    <div>
      <h1>학급 자리배치</h1>
      <p class="muted">선생님은 반을 관리하고 배치를 실행합니다. 학생은 본인 정보만 입력합니다.</p>
      <div class="row" style="margin-top:24px;">
        <div class="card" style="flex:1; min-width:220px; cursor:pointer;" id="goTeacher">
          <h2>선생님</h2>
          <p class="muted">반 생성, 학생 계정 발급, 배치 실행</p>
        </div>
        <div class="card" style="flex:1; min-width:220px; cursor:pointer;" id="goStudent">
          <h2>학생</h2>
          <p class="muted">번호 + PIN으로 로그인, 정보 입력</p>
        </div>
      </div>
    </div>
  `));
  document.getElementById('goTeacher').onclick = () => renderTeacherAuth();
  document.getElementById('goStudent').onclick = () => renderStudentAuth();
}

// ────────────────────────────────────────────────────────────
// 선생님 인증 — 일반 Firebase Auth (이메일/비밀번호)
// ────────────────────────────────────────────────────────────
function renderTeacherAuth(mode = 'login') {
  app.innerHTML = '';
  const wrap = el(`
    <div style="max-width:380px;">
      <a href="#" class="back" id="back">← 뒤로</a>
      <h1 style="margin-top:14px;">선생님 ${mode === 'login' ? '로그인' : '회원가입'}</h1>
      <div class="tabs">
        <button id="tabLogin" class="${mode === 'login' ? 'active' : ''}">로그인</button>
        <button id="tabSignup" class="${mode === 'signup' ? 'active' : ''}">회원가입</button>
      </div>
      <div class="card">
        <label>이메일</label>
        <input type="email" id="email" placeholder="teacher@school.ac.kr" />
        <label>비밀번호</label>
        <input type="password" id="pw" placeholder="6자 이상" />
        <div style="margin-top:16px;">
          <button id="submit">${mode === 'login' ? '로그인' : '가입하기'}</button>
        </div>
        <div class="error" id="err" style="display:none;"></div>
      </div>
    </div>
  `);
  app.appendChild(wrap);
  document.getElementById('back').onclick = (e) => { e.preventDefault(); renderLanding(); };
  document.getElementById('tabLogin').onclick = () => renderTeacherAuth('login');
  document.getElementById('tabSignup').onclick = () => renderTeacherAuth('signup');
  document.getElementById('submit').onclick = async () => {
    const email = document.getElementById('email').value.trim();
    const pw = document.getElementById('pw').value;
    const errEl = document.getElementById('err');
    errEl.style.display = 'none';
    try {
      if (mode === 'login') await signInWithEmailAndPassword(auth, email, pw);
      else await createUserWithEmailAndPassword(auth, email, pw);
      // onAuthStateChanged가 render()를 자동 호출함
    } catch (e) {
      errEl.textContent = e.message.replace('Firebase: ', '');
      errEl.style.display = 'block';
    }
  };
}

// ────────────────────────────────────────────────────────────
// 선생님 — 반 목록 / 반 생성 / 보관
// ────────────────────────────────────────────────────────────
async function renderTeacher() {
  app.innerHTML = '불러오는 중...';
  const uid = auth.currentUser.uid;

  // 보안 규칙은 필터가 아니므로, 반드시 teacherUid 조건을 쿼리에 넣어야 읽기가 허용된다.
  let snap;
  try {
    snap = await getDocs(query(collection(db, 'classes'), where('teacherUid', '==', uid)));
  } catch (e) {
    showFatal(e);
    return;
  }
  const all = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  const myClasses = all.filter((c) => !c.archived);
  const archived = all.filter((c) => c.archived);

  app.innerHTML = '';
  app.appendChild(el(`
    <div class="row" style="justify-content:space-between; margin-bottom:20px;">
      <h1>내 학급</h1>
      <button class="secondary" id="logout">로그아웃</button>
    </div>
  `));
  document.getElementById('logout').onclick = () => signOut(auth);

  if (all.length === 0) {
    renderNewClassForm();
    return;
  }

  const item = (c) => {
    const node = el(`
      <div class="class-item">
        <div><strong>${esc(c.name) || '(이름 없음)'}</strong><div class="muted">코드: ${esc(c.id)}</div></div>
        <span class="muted">${Object.keys(c.roster || {}).length}명 →</span>
      </div>
    `);
    node.onclick = () => renderClassBody(c.id, 'students');
    return node;
  };

  const list = el(`<div class="card"><h2>반 목록</h2><div class="class-list" id="list"></div></div>`);
  app.appendChild(list);
  const listEl = list.querySelector('#list');
  if (myClasses.length === 0) listEl.innerHTML = '<p class="muted">사용 중인 반이 없습니다.</p>';
  myClasses.forEach((c) => listEl.appendChild(item(c)));

  app.appendChild(el(`<button id="newClass" style="margin-top:4px;">+ 새 반 만들기</button>`));
  document.getElementById('newClass').onclick = () => renderNewClassForm();

  if (archived.length) {
    const box = el(`<details class="card" style="margin-top:20px;"><summary>보관된 반 (${archived.length})</summary><div class="class-list" id="archList" style="margin-top:12px;"></div></details>`);
    app.appendChild(box);
    archived.forEach((c) => box.querySelector('#archList').appendChild(item(c)));
  }
}

function renderNewClassForm() {
  app.innerHTML = '';
  const wrap = el(`
    <div>
      <a href="#" class="back" id="back">← 반 목록</a>
      <h1 style="margin-top:14px;">새 반 만들기</h1>
      <div class="card" style="max-width:420px;">
        <label>반 이름</label>
        <input id="name" placeholder="예: 2학년 3반" />
        <div class="row">
          <div style="flex:1;">
            <label>가로 좌석 수 (열)</label>
            <input id="cols" type="number" value="6" min="1" max="${MAX_DIM}" />
          </div>
          <div style="flex:1;">
            <label>세로 좌석 수 (행)</label>
            <input id="rows" type="number" value="5" min="1" max="${MAX_DIM}" />
          </div>
        </div>
        <p class="muted" style="margin-top:10px;">교실 배치도(통로, 에어컨 위치)는 반 생성 후 '배치도' 탭에서 세부 설정할 수 있습니다.</p>
        <button id="create" style="margin-top:8px;">반 만들기</button>
        <div class="error" id="err" style="display:none;"></div>
      </div>
    </div>
  `);
  app.appendChild(wrap);
  document.getElementById('back').onclick = (e) => { e.preventDefault(); renderTeacher(); };
  document.getElementById('create').onclick = async () => {
    const name = document.getElementById('name').value.trim();
    const cols = parseInt(document.getElementById('cols').value, 10);
    const rows = parseInt(document.getElementById('rows').value, 10);
    const errEl = document.getElementById('err');
    if (!name || !cols || !rows) { setMsg(errEl, '모든 값을 입력해주세요'); return; }
    if (cols > MAX_DIM || rows > MAX_DIM) { setMsg(errEl, `행/열은 최대 ${MAX_DIM}까지 설정할 수 있습니다`); return; }
    const grid = Array.from({ length: rows * cols }, () => ({ type: 'seat', aircon: false }));
    const classId = (name.replace(/[\s\/]+/g, '') + '-' + Math.random().toString(36).slice(2, 6)).toLowerCase();
    try {
      await setDoc(doc(db, 'classes', classId), {
        teacherUid: auth.currentUser.uid,
        name, rows, cols, grid,
        roster: {},
        archived: false,
        createdAt: new Date().toISOString(),
      });
      // 제약조건/가중치는 학생이 읽을 수 없는 settings 문서에 저장
      await setDoc(doc(db, 'classes', classId, 'settings', 'config'), {
        constraints: emptyCons(),
        weights: { ...DEFAULT_WEIGHTS },
      });
      renderClassBody(classId, 'students');
    } catch (e) {
      setMsg(errEl, e.message);
    }
  };
}

// ────────────────────────────────────────────────────────────
// 선생님 — 반 상세 (탭: 학생·현황 / 배치도 / 제약조건 / 배치·결과)
// ────────────────────────────────────────────────────────────
let ST = null; // { classId, c, settings, result, history, status, tab, dirty }

async function loadClass(classId) {
  const [cs, ss, rs, hs] = await Promise.all([
    getDoc(doc(db, 'classes', classId)),
    getDoc(doc(db, 'classes', classId, 'settings', 'config')).catch(() => null),
    getDoc(doc(db, 'classes', classId, 'results', 'current')).catch(() => null),
    getDocs(query(collection(db, 'classes', classId, 'history'), orderBy('createdAt', 'desc'), limit(20))).catch(() => null),
  ]);
  if (!cs.exists()) return null;
  const c = { id: classId, ...cs.data() };
  const s = ss && ss.exists() ? ss.data() : {};
  // 예전에 만든 반은 class 문서에 constraints/weights가 들어 있으므로 그쪽도 읽는다.
  const settings = {
    constraints: normCons(s.constraints ?? c.constraints),
    weights: { ...DEFAULT_WEIGHTS, ...(s.weights ?? c.weights ?? {}) },
  };
  return {
    classId, c, settings,
    result: rs && rs.exists() ? rs.data() : null,
    history: hs ? hs.docs.map((d) => ({ id: d.id, ...d.data() })) : [],
  };
}

// 제약조건/가중치 저장. 예전 방식(class 문서)에 남아 있던 값은 이때 함께 옮기고 지운다.
async function saveSettings(patch) {
  const next = { constraints: ST.settings.constraints, weights: ST.settings.weights, ...patch };
  await setDoc(doc(db, 'classes', ST.classId, 'settings', 'config'), next);
  if (ST.c.constraints !== undefined || ST.c.weights !== undefined) {
    await updateDoc(doc(db, 'classes', ST.classId), { constraints: deleteField(), weights: deleteField() });
    delete ST.c.constraints;
    delete ST.c.weights;
  }
  ST.settings = next;
}

async function renderClassBody(classId, tab) {
  app.innerHTML = '불러오는 중...';
  let loaded;
  try { loaded = await loadClass(classId); } catch (e) { showFatal(e); return; }
  if (!loaded) { renderTeacher(); return; }
  const prevTab = ST && ST.classId === classId ? ST.tab : 'students';
  ST = { ...loaded, tab: tab || prevTab, dirty: false, status: null };
  drawClass();
}

const TABS = [['students', '학생·현황'], ['layout', '배치도'], ['constraints', '제약조건'], ['seating', '배치·결과']];

function confirmLeave() {
  return !ST.dirty || confirm('저장하지 않은 변경 사항이 있습니다. 이동할까요?');
}

function drawClass() {
  const { c } = ST;
  app.innerHTML = '';
  app.appendChild(el(`
    <div>
      <a href="#" class="back" id="back">← 반 목록</a>
      <div style="margin-top:14px;">
        <h1>${esc(c.name)}${c.archived ? '<span class="tag">보관됨</span>' : ''}</h1>
        <p class="muted">반 코드: <strong>${esc(c.id)}</strong> (학생에게 공유하세요)</p>
      </div>
    </div>
  `));
  document.getElementById('back').onclick = (e) => { e.preventDefault(); if (confirmLeave()) renderTeacher(); };

  const tabs = el(`<div class="tabs">${TABS.map(([k, label]) => `<button data-tab="${k}" class="${ST.tab === k ? 'active' : ''}">${label}</button>`).join('')}</div>`);
  tabs.querySelectorAll('button').forEach((b) => {
    b.onclick = () => {
      if (b.dataset.tab === ST.tab || !confirmLeave()) return;
      ST.dirty = false;
      ST.tab = b.dataset.tab;
      drawClass();
    };
  });
  app.appendChild(tabs);

  const host = el('<div id="tabBody"></div>');
  app.appendChild(host);
  ({ students: tabStudents, layout: tabLayout, constraints: tabConstraints, seating: tabSeating })[ST.tab](host);
}

// ── 탭 1: 학생 계정 / 제출 현황 / 반 관리 ──────────────────────

      res.created.forEach((s) => { c.roster = { ...(c.roster || {}), [s.number]: s.name }; });

      <div class="row" style="justify-content:space-between;">
        <h2>제출 현황</h2>
        <button class="secondary tiny" id="refreshStatus">새로고침</button>

  const box = statusCard.querySelector('#statusBox');
  async function loadStatus() {
    box.innerHTML = '<p class="muted">불러오는 중...</p>';
    try {
      const res = await authApi('/api/submission-status', { classId });
      ST.status = res;
      const missing = res.students.filter((s) => !s.submitted);
      const pct = res.total ? Math.round((res.submittedCount / res.total) * 100) : 0;
      box.innerHTML = '';
      box.appendChild(el(`<div><p>제출 <strong>${res.submittedCount}</strong> / ${res.total}명</p><div class="bar"><div style="width:${pct}%"></div></div></div>`));
      if (res.total === 0) box.appendChild(el('<p class="muted">등록된 학생이 없습니다.</p>'));
      else if (missing.length === 0) box.appendChild(el('<p class="success">모든 학생이 제출했습니다 ✓</p>'));
      else {

        ? '이 반은 보관 중입니다. 학생 로그인과 정보 수정이 막혀 있고 반 목록에서도 분리되어 보입니다.'
        : '보관하면 학생 로그인·정보 수정이 막히고 목록에서 분리됩니다. 데이터는 그대로 남으며 언제든 해제할 수 있습니다.'}</p>

// ── 탭 2: 좌석 배치도 편집기 ───────────────────────────────────
function tabLayout(host) {
  const { c } = ST;
  const rosterCount = Object.keys(c.roster || {}).length;
  const d = { rows: c.rows, cols: c.cols, grid: c.grid.map((x) => ({ type: x.type, aircon: !!x.aircon })) };
  let mode = 'aisle'; // 'aisle' | 'aircon'

  const card = el(`
    <div class="card">
      <h2>좌석 배치도 편집</h2>
      <p class="muted">칸을 눌러 좌석 ↔ 통로를 바꾸거나, 에어컨 근처 좌석을 표시하세요. 위쪽이 칠판(앞)입니다.</p>
      <div class="row" style="margin-top:8px;">
        <div style="width:90px;"><label style="margin-top:0;">열(가로)</label><input id="lcols" type="number" min="1" max="${MAX_DIM}" value="${d.cols}" /></div>
        <div style="width:90px;"><label style="margin-top:0;">행(세로)</label><input id="lrows" type="number" min="1" max="${MAX_DIM}" value="${d.rows}" /></div>
        <button class="secondary" id="resize" style="align-self:flex-end;">크기 적용</button>
        <span style="flex:1;"></span>
        <button class="secondary" id="modeAisle" style="align-self:flex-end;">좌석 ↔ 통로</button>
        <button class="secondary" id="modeAircon" style="align-self:flex-end;">에어컨 표시</button>
      </div>
      <div id="layoutInfo" class="muted" style="margin-top:10px;"></div>
      <div id="layoutMap"></div>
      <div class="row">
        <button id="saveLayout">저장</button>
        <button class="secondary" id="resetLayout">되돌리기</button>
      </div>
      <div id="layoutMsg" style="display:none;"></div>
      <p class="muted" style="margin-top:12px;">저장해도 이미 만들어진 배치 결과와 이력은 그때의 좌석표 그대로 보관됩니다. 고정석이 사라지는 칸에 있으면 해제되고, 학생이 고른 선호 좌석이 더 이상 좌석이 아니면 배치 계산에서 자동으로 무시됩니다.</p>
    </div>
  `);
  host.appendChild(card);
  const msgEl = card.querySelector('#layoutMsg');
  const markDirty = () => { ST.dirty = true; };

  function paint() {
    card.querySelector('#modeAisle').classList.toggle('on', mode === 'aisle');
    card.querySelector('#modeAircon').classList.toggle('on', mode === 'aircon');
    const seatCount = d.grid.filter((x) => x.type === 'seat').length;
    const info = card.querySelector('#layoutInfo');
    info.innerHTML = `좌석 <strong>${seatCount}</strong>개 · 등록 학생 ${rosterCount}명` +
      (seatCount < rosterCount ? ` <span class="error" style="display:inline;">— 좌석이 학생 수보다 적습니다</span>` : '');

    const mapHost = card.querySelector('#layoutMap');
    mapHost.innerHTML = '';
    // 열 전체를 통로/좌석으로 한 번에 바꾸는 버튼
    const tools = el(`<div class="col-tools" style="grid-template-columns: repeat(${d.cols}, minmax(0, 1fr));"></div>`);
    for (let col = 0; col < d.cols; col++) {
      const b = el(`<button class="secondary tiny" title="${col + 1}열 전체를 통로/좌석으로 전환">${col + 1}열 ⇅</button>`);
      b.onclick = () => {
        const idxs = Array.from({ length: d.rows }, (_, r) => r * d.cols + col);
        const anySeat = idxs.some((i) => d.grid[i].type === 'seat');
        idxs.forEach((i) => { d.grid[i] = { type: anySeat ? 'aisle' : 'seat', aircon: false }; });
        markDirty();
        paint();
      };
      tools.appendChild(b);
    }
    mapHost.appendChild(tools);
    mapHost.appendChild(mapEl(d.cols, d.grid, {
      cell: (cell) => ({
        cls: 'editable',
        clickable: true,
        html: cell.type === 'seat' ? (cell.aircon ? '<div class="num">❄ 에어컨</div>' : '') : '<div class="num">통로</div>',
      }),
      onClick: (i) => {
        const cell = d.grid[i];
        if (mode === 'aisle') {
          d.grid[i] = cell.type === 'seat' ? { type: 'aisle', aircon: false } : { type: 'seat', aircon: false };
        } else if (cell.type === 'seat') {
          d.grid[i] = { type: 'seat', aircon: !cell.aircon };
        } else return;
        markDirty();
        paint();
      },
    }));
  }

  card.querySelector('#modeAisle').onclick = () => { mode = 'aisle'; paint(); };
  card.querySelector('#modeAircon').onclick = () => { mode = 'aircon'; paint(); };
  card.querySelector('#resize').onclick = () => {
    const cols = parseInt(card.querySelector('#lcols').value, 10);
    const rows = parseInt(card.querySelector('#lrows').value, 10);
    if (!cols || !rows || cols < 1 || rows < 1 || cols > MAX_DIM || rows > MAX_DIM) {
      setMsg(msgEl, `행/열은 1~${MAX_DIM} 사이로 입력하세요`);
      return;
    }
    setMsg(msgEl, '');
    const next = Array.from({ length: rows * cols }, (_, i) => {
      const r = Math.floor(i / cols), cc = i % cols;
      if (r < d.rows && cc < d.cols) return d.grid[r * d.cols + cc]; // 기존 칸은 위치 그대로 유지
      return { type: 'seat', aircon: false };
    });
    d.rows = rows; d.cols = cols; d.grid = next;
    markDirty();
    paint();
  };
  card.querySelector('#resetLayout').onclick = () => { ST.dirty = false; drawClass(); };

  card.querySelector('#saveLayout').onclick = async () => {
    const seatCount = d.grid.filter((x) => x.type === 'seat').length;
    if (seatCount === 0) { setMsg(msgEl, '좌석이 하나 이상 있어야 합니다'); return; }

    // 고정석은 좌석 번호(행*열수+열) 기준이라 좌석표 크기가 바뀌면 같은 (행,열) 위치로 다시 계산해준다.
    const oldFixed = ST.settings.constraints.fixedSeats;
    const newFixed = {};
    let dropped = 0;
    Object.entries(oldFixed).forEach(([k, id]) => {
      const i = Number(k);
      const r = Math.floor(i / c.cols), cc = i % c.cols;
      if (r < d.rows && cc < d.cols && d.grid[r * d.cols + cc].type === 'seat') newFixed[String(r * d.cols + cc)] = id;
      else dropped++;
    });
    if (dropped && !confirm(`고정석 ${dropped}곳이 사라지는 칸에 있어 해제됩니다. 계속할까요?`)) return;

    try {
      await updateDoc(doc(db, 'classes', c.id), { rows: d.rows, cols: d.cols, grid: d.grid });
      const fixedChanged = JSON.stringify(oldFixed) !== JSON.stringify(newFixed);
      Object.assign(c, { rows: d.rows, cols: d.cols, grid: d.grid });
      if (fixedChanged) await saveSettings({ constraints: { ...ST.settings.constraints, fixedSeats: newFixed } });
      ST.dirty = false;
      setMsg(msgEl, '저장되었습니다', 'ok');
      paint();
    } catch (e) {
      setMsg(msgEl, e.message);
    }
  };

  paint();
}

// ── 탭 3: 제약조건 설정기 ─────────────────────────────────────
const PAIR_TYPES = [
  ['blacklist', '인접 금지 (옆·대각선에 앉지 않게)'],
  ['whitelist', '반드시 인접'],
  ['far', '떨어뜨리기 · 어느 정도'],
  ['farthest', '떨어뜨리기 · 최대한 멀리'],
];

function tabConstraints(host) {
  const { c } = ST;

  const nums = Object.keys(roster).sort((a, b) => Number(a) - Number(b));
  const nameOf = (n) => `${n}번 ${roster[n] ?? ''}`.trim();

  const markDirty = () => { ST.dirty = true; };

  if (nums.length === 0) {
    host.appendChild(el('<div class="card"><h2>제약조건</h2><p class="muted">먼저 \'학생·현황\' 탭에서 학생 계정을 생성하세요.</p></div>'));
    return;
  }
  const opts = nums.map((n) => `<option value="${esc(n)}">${esc(nameOf(n))}</option>`).join('');

  // 학생 쌍 제약
  const pairCard = el(`
    <div class="card">
      <h2>학생 쌍 제약</h2>
      <p class="muted">모두 <strong>반드시 지켜야 하는 조건</strong>입니다. 조건끼리 모순되어 지킬 수 없으면 배치 결과에 경고가 표시됩니다.</p>
      <div class="row" style="margin-top:8px;">
        <select id="selA" style="flex:1; min-width:130px;"><option value="">학생 선택</option>${opts}</select>
        <select id="selB" style="flex:1; min-width:130px;"><option value="">학생 선택</option>${opts}</select>
        <select id="selT" style="flex:1.4; min-width:200px;">${PAIR_TYPES.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>
        <button id="addPair">추가</button>
      </div>
      <p class="muted" style="margin-top:8px;">떨어뜨리기 기준(체비셰프 거리: 가로·세로 중 큰 쪽): 어느 정도 = ${sepMin('far', span)}칸 이상, 최대한 멀리 = ${sepMin('farthest', span)}칸 이상 (현재 좌석표 기준)</p>
      <div id="pairErr" style="display:none;"></div>
      <div id="pairList"></div>
    </div>
  `);
  host.appendChild(pairCard);
  const pairErr = pairCard.querySelector('#pairErr');

  function paintPairs() {
    const out = pairCard.querySelector('#pairList');
    out.innerHTML = '';
    const groups = [
      ['blacklist', '인접 금지', cons.blacklist],
      ['whitelist', '반드시 인접', cons.whitelist],
      ['far', '떨어뜨리기 · 어느 정도', cons.separate.filter((p) => p.level === 'far')],
      ['farthest', '떨어뜨리기 · 최대한 멀리', cons.separate.filter((p) => p.level === 'farthest')],
    ];
    let any = false;
    groups.forEach(([key, title, items]) => {
      if (!items.length) return;
      any = true;
      out.appendChild(el(`<div class="group-title">${title} (${items.length})</div>`));
      items.forEach((p) => {
        const row = el(`<div class="pair-row"><span>${esc(nameOf(p.a))} ↔ ${esc(nameOf(p.b))}</span><button class="link">삭제</button></div>`);
        row.querySelector('button').onclick = () => {
          if (key === 'blacklist') cons.blacklist = cons.blacklist.filter((x) => x !== p);
          else if (key === 'whitelist') cons.whitelist = cons.whitelist.filter((x) => x !== p);
          else cons.separate = cons.separate.filter((x) => x !== p);
          markDirty();
          paintPairs();
        };
        out.appendChild(row);
      });
    });
    if (!any) out.appendChild(el('<p class="muted" style="margin-top:12px;">등록된 쌍 제약이 없습니다.</p>'));
  }

  pairCard.querySelector('#addPair').onclick = () => {
    const a = pairCard.querySelector('#selA').value;
    const b = pairCard.querySelector('#selB').value;
    const t = pairCard.querySelector('#selT').value;
    if (!a || !b) return setMsg(pairErr, '두 학생을 모두 선택하세요');
    if (a === b) return setMsg(pairErr, '서로 다른 학생을 선택하세요');
    const same = (p) => (p.a === a && p.b === b) || (p.a === b && p.b === a);
    if (t === 'blacklist' && cons.blacklist.some(same)) return setMsg(pairErr, '이미 등록된 쌍입니다');
    if (t === 'whitelist' && cons.whitelist.some(same)) return setMsg(pairErr, '이미 등록된 쌍입니다');
    if (t === 'whitelist' && (cons.blacklist.some(same) || cons.separate.some(same))) {
      return setMsg(pairErr, '이 쌍은 이미 인접 금지/떨어뜨리기로 등록되어 있어 "반드시 인접"과 모순됩니다');
    }
    if (t !== 'whitelist' && cons.whitelist.some(same)) {
      return setMsg(pairErr, '이 쌍은 이미 "반드시 인접"으로 등록되어 있어 모순됩니다');
    }
    setMsg(pairErr, '');
    const [p, q] = Number(a) <= Number(b) ? [a, b] : [b, a];
    if (t === 'blacklist') cons.blacklist.push({ a: p, b: q });
    else if (t === 'whitelist') cons.whitelist.push({ a: p, b: q });
    else {
      cons.separate = cons.separate.filter((x) => !same(x)); // 같은 쌍은 하나의 단계만 유지
      cons.separate.push({ a: p, b: q, level: t });
    }
    markDirty();
    paintPairs();
  };
  paintPairs();

  // 고정석
  const fixCard = el(`
    <div class="card">
      <h2>고정석</h2>
      <p class="muted">학생을 고른 뒤 좌석표에서 앉힐 자리를 누르세요. 이미 고정된 자리를 누르면 해제됩니다. 고정석 학생은 배치 때 움직이지 않습니다.</p>
      <select id="selFix" style="max-width:260px;"><option value="">학생 선택</option>${opts}</select>
      <div id="fixErr" style="display:none;"></div>
      <div id="fixMap"></div>
    </div>
  `);
  host.appendChild(fixCard);
  const fixErr = fixCard.querySelector('#fixErr');
  function paintFix() {
    const mapHost = fixCard.querySelector('#fixMap');
    mapHost.innerHTML = '';
    mapHost.appendChild(mapEl(c.cols, c.grid, {
      cell: (cell, i) => {
        if (cell.type !== 'seat') return {};
        const id = cons.fixedSeats[String(i)];
        return {
          clickable: true,
          cls: id ? 'fixed' : '',
          html: id ? `<div class="name">${esc(roster[id] ?? id)}</div><div class="num">${esc(id)}번 · 고정</div>` : '',
        };
      },
      onClick: (i) => {
        const k = String(i);
        if (cons.fixedSeats[k]) {
          delete cons.fixedSeats[k];
        } else {
          const sid = fixCard.querySelector('#selFix').value;
          if (!sid) return setMsg(fixErr, '먼저 위에서 학생을 선택하세요');
          setMsg(fixErr, '');
          Object.keys(cons.fixedSeats).forEach((s) => { if (cons.fixedSeats[s] === sid) delete cons.fixedSeats[s]; });
          cons.fixedSeats[k] = sid;
        }
        markDirty();
        paintFix();
      },
    }));
  }
  paintFix();

  const saveRow = el(`
    <div class="card">
      <div class="row">
        <button id="saveCons">제약조건 저장</button>
        <button class="secondary" id="resetCons">되돌리기</button>
      </div>
      <div id="consMsg" style="display:none;"></div>
    </div>
  `);
  host.appendChild(saveRow);
  const consMsg = saveRow.querySelector('#consMsg');
  saveRow.querySelector('#resetCons').onclick = () => { ST.dirty = false; drawClass(); };
  saveRow.querySelector('#saveCons').onclick = async () => {
    try {
      await saveSettings({ constraints: normCons(cons) });
      ST.dirty = false;
      setMsg(consMsg, '저장되었습니다', 'ok');
    } catch (e) {
      setMsg(consMsg, e.message);
    }
  };
}

// ── 내보내기 (PNG / PDF) ──────────────────────────────────────
const FONT_STACK = '"Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif';

function roundRectPath(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

// 결과 좌석표를 canvas로 그린다. PNG는 이 canvas를 그대로, PDF는 이 이미지를 페이지에 넣는다
// (브라우저가 글자를 그리므로 PDF 라이브러리에 한글 폰트가 없어도 된다).
function drawSeatCanvas(data, title) {
  const { rows, cols, grid } = data;
  const CW = 124, CH = 76, GAP = 8, PAD = 36, HEAD = 70, BOARD = 36;
  const W = PAD * 2 + cols * CW + (cols - 1) * GAP;
  const H = PAD + HEAD + BOARD + 20 + rows * CH + (rows - 1) * GAP + PAD;
  const S = 2;
  const cv = document.createElement('canvas');
  cv.width = W * S;
  cv.height = H * S;
  const g = cv.getContext('2d');
  g.scale(S, S);

  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, W, H);

  g.textAlign = 'left';
  g.textBaseline = 'alphabetic';
  g.fillStyle = '#1f3a2e';
  g.font = `700 26px ${FONT_STACK}`;
  g.fillText(`${title} 자리배치`, PAD, PAD + 26);
  g.fillStyle = '#6b7a72';
  g.font = `400 13px ${FONT_STACK}`;
  g.fillText(data.createdAt ? new Date(data.createdAt).toLocaleString('ko-KR') : '', PAD, PAD + 50);

  // 칠판
  const by = PAD + HEAD;
  g.fillStyle = '#1f3a2e';
  roundRectPath(g, PAD, by, W - PAD * 2, BOARD, 6);
  g.fill();
  g.fillStyle = '#f4f1e6';
  g.font = `600 15px ${FONT_STACK}`;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText('칠   판', W / 2, by + BOARD / 2);

  // 좌석
  const top = by + BOARD + 20;
  grid.forEach((cell, i) => {
    if (cell.type !== 'seat') return;
    const r = Math.floor(i / cols), cc = i % cols;
    const x = PAD + cc * (CW + GAP);
    const y = top + r * (CH + GAP);
    roundRectPath(g, x, y, CW, CH, 8);
    g.fillStyle = cell.name ? '#f6f4ea' : '#fafafa';
    g.fill();
    g.lineWidth = cell.aircon ? 2.5 : 1.2;
    g.strokeStyle = cell.aircon ? '#d4a73a' : '#b9c2bb';
    g.stroke();

    g.textAlign = 'center';
    g.textBaseline = 'middle';
    const label = cell.name || '-';
    let size = 22;
    g.font = `700 ${size}px ${FONT_STACK}`;
    while (g.measureText(label).width > CW - 16 && size > 11) {
      size -= 1;
      g.font = `700 ${size}px ${FONT_STACK}`;
    }
    g.fillStyle = cell.name ? '#1f3a2e' : '#b0b8b2';
    g.fillText(label, x + CW / 2, y + CH / 2 - 6);
    if (cell.number) {
      g.font = `400 12px ${FONT_STACK}`;
      g.fillStyle = '#6b7a72';
      g.fillText(`${cell.number}번`, x + CW / 2, y + CH / 2 + 18);
    }
  });
  return cv;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const safeFile = (s) => String(s).replace(/[\\/:*?"<>|\s]+/g, '_');

function exportPNG(data, title) {
  const cv = drawSeatCanvas(data, title);
  cv.toBlob((b) => downloadBlob(b, `${safeFile(title)}_자리배치.png`), 'image/png');
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (window.jspdf) return resolve();
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('PDF 라이브러리를 불러오지 못했습니다. 네트워크를 확인하거나 PNG로 내보내세요.'));
    document.head.appendChild(s);
  });
}

async function exportPDF(data, title) {
  await loadScript(JSPDF_URL);
  const { jsPDF } = window.jspdf;
  const cv = drawSeatCanvas(data, title);
  const pdf = new jsPDF({ orientation: cv.width >= cv.height ? 'l' : 'p', unit: 'pt', format: 'a4' });
  const pw = pdf.internal.pageSize.getWidth();
  const ph = pdf.internal.pageSize.getHeight();
  const m = 24;
  const k = Math.min((pw - m * 2) / cv.width, (ph - m * 2) / cv.height);
  const w = cv.width * k, h = cv.height * k;
  pdf.addImage(cv.toDataURL('image/png'), 'PNG', (pw - w) / 2, m, w, h);
  pdf.save(`${safeFile(title)}_자리배치.pdf`);
}

// ── 탭 4: 가중치 / 배치 실행 / 결과(수동 조정·내보내기) / 이력 ─────────
function tabSeating(host) {
  const { c, classId } = ST;

  // 가중치
  const w = ST.settings.weights;
  const weightsCard = el(`
    <div class="card">
      <h2>배치 가중치</h2>
      <p class="muted">각 항목이 배치 점수에서 얼마나 중요한지 조절합니다. (제약조건 탭의 조건은 가중치와 무관하게 항상 지켜집니다.)</p>
      <div id="weightRows"></div>
      <button id="saveWeights" class="secondary" style="margin-top:6px;">가중치 저장</button>
      <span id="wMsg" style="display:none; margin-left:10px;"></span>
    </div>
  `);
  host.appendChild(weightsCard);
  const wRows = weightsCard.querySelector('#weightRows');
  WEIGHT_LABELS.forEach(([key, label]) => {
    const val = w[key] ?? DEFAULT_WEIGHTS[key] ?? 3;
    const row = el(`
      <div class="weight-row">
        <label style="margin:0;">${label}</label>
        <input type="range" min="0" max="10" value="${val}" data-key="${key}" />
        <span>${val}</span>
      </div>
    `);
    const input = row.querySelector('input');
    const span = row.querySelector('span');
    input.oninput = () => { span.textContent = input.value; };
    wRows.appendChild(row);
  });
  weightsCard.querySelector('#saveWeights').onclick = async () => {
    const newWeights = {};
    wRows.querySelectorAll('input').forEach((i) => { newWeights[i.dataset.key] = Number(i.value); });
    const m = weightsCard.querySelector('#wMsg');
    try {
      await saveSettings({ weights: newWeights });
      setMsg(m, '저장되었습니다', 'ok');
      m.style.display = 'inline';
    } catch (e) {
      setMsg(m, e.message);
      m.style.display = 'inline';
    }
  };

  // 배치 실행
  const runCard = el(`
    <div class="card">
      <h2>배치 실행</h2>
      <p class="muted">정보를 입력 완료한 학생들을 대상으로 최적 좌석을 계산합니다. 실행할 때마다 이력에 저장됩니다. 최대 30초 정도 걸릴 수 있습니다.</p>
      <p class="muted" id="runNote"></p>
      <button id="runSeating" ${c.archived ? 'disabled' : ''}>배치 실행</button>
      <span id="runStatus" class="muted" style="margin-left:10px;"></span>
      <div class="error" id="err2" style="display:none;"></div>
    </div>
  `);
  host.appendChild(runCard);
  const refreshNote = (st) => {
    const n = st.students.filter((s) => !s.submitted).length;
    runCard.querySelector('#runNote').textContent = n ? `※ 미제출 학생 ${n}명은 이번 배치에 포함되지 않습니다.` : '';
  };
  if (ST.status) refreshNote(ST.status);
  else authApi('/api/submission-status', { classId }).then((st) => { ST.status = st; refreshNote(st); }).catch(() => {});

  runCard.querySelector('#runSeating').onclick = async () => {
    const btn = runCard.querySelector('#runSeating');
    const status = runCard.querySelector('#runStatus');
    const errEl = runCard.querySelector('#err2');
    setMsg(errEl, '');
    const missing = ST.status ? ST.status.students.filter((s) => !s.submitted).length : 0;
    if (missing && !confirm(`미제출 학생 ${missing}명은 이번 배치에서 제외됩니다. 계속할까요?`)) return;
    btn.disabled = true;
    status.textContent = '계산 중...';
    try {
      await authApi('/api/run-seating', { classId });
      renderClassBody(classId, 'seating');
    } catch (e) {
      setMsg(errEl, e.message);
      status.textContent = '';
      btn.disabled = false;
    }
  };

  // 결과 카드 (수동 조정 + 내보내기)
  const resultCard = el('<div class="card"></div>');
  host.appendChild(resultCard);
  let edit = false, draft = null, sel = null, changed = false;

  function paintResult() {
    const r = ST.result;
    resultCard.innerHTML = '';
    if (!r) {
      resultCard.appendChild(el('<div><h2>최종 좌석 배치</h2><p class="muted">아직 배치 결과가 없습니다. 위에서 배치를 실행하세요.</p></div>'));
      return;
    }
    const grid = edit ? draft : r.grid;
    const warnings = r.warnings || [];
    resultCard.appendChild(el(`
      <div>
        <div class="row" style="justify-content:space-between;">
          <h2>최종 좌석 배치<span class="tag">${esc(r.label || '자동 배치')}</span></h2>
          <span class="score-badge">점수 ${Math.round(r.score)}</span>
        </div>
        <p class="muted">${esc(fmtTime(r.createdAt))}</p>
      </div>
    `));
    if (warnings.length) {
      const box = el('<div class="warn-box"><strong>확인 필요 — 지켜지지 않은 조건이 있습니다</strong><ul></ul></div>');
      warnings.forEach((m) => { const li = document.createElement('li'); li.textContent = m; box.querySelector('ul').appendChild(li); });
      resultCard.appendChild(box);
    }

    const bar = el('<div class="row"></div>');
    if (!edit) {
      bar.appendChild(el('<button class="secondary" id="editBtn">수동 조정</button>'));
      bar.appendChild(el('<button class="secondary" id="pngBtn">PNG로 저장</button>'));
      bar.appendChild(el('<button class="secondary" id="pdfBtn">PDF로 저장</button>'));
    } else {
      bar.appendChild(el(`<button id="saveEdit" ${changed ? '' : 'disabled'}>조정 저장</button>`));
      bar.appendChild(el('<button class="secondary" id="cancelEdit">취소</button>'));
      bar.appendChild(el('<span class="muted">두 자리를 차례로 누르거나 학생 칸을 끌어다 놓으면 자리가 바뀝니다. 빈 자리로도 옮길 수 있습니다.</span>'));
    }
    resultCard.appendChild(bar);
    const errEl = el('<div class="error" style="display:none;"></div>');
    resultCard.appendChild(errEl);

    resultCard.appendChild(mapEl(r.cols, grid, {
      cell: (cell, i) => {
        if (cell.type !== 'seat') return {};
        const html = `<div class="name">${esc(cell.name || '-')}</div><div class="num">${esc(cell.number || '')}</div>`;
        if (!edit) return { html };
        return { html, clickable: true, draggable: !!cell.number, dropTarget: true, cls: sel === i ? 'selected' : '' };
      },
      onClick: (i) => {
        if (sel === null) sel = i;
        else if (sel === i) sel = null;
        else { swap(sel, i); sel = null; }
        paintResult();
      },
      onDrop: (from, to) => { if (from !== to) swap(from, to); sel = null; paintResult(); },
    }));

    const title = c.name;
    const q = (id) => resultCard.querySelector(id);
    if (!edit) {
      q('#editBtn').onclick = () => {
        draft = r.grid.map((x) => ({ ...x }));
        edit = true; sel = null; changed = false;
        paintResult();
      };
      q('#pngBtn').onclick = () => exportPNG(r, title);
      q('#pdfBtn').onclick = async () => {
        try { await exportPDF(r, title); } catch (e) { setMsg(errEl, e.message); }
      };
    } else {
      q('#cancelEdit').onclick = () => { edit = false; draft = null; sel = null; changed = false; ST.dirty = false; paintResult(); };
      q('#saveEdit').onclick = async () => {
        q('#saveEdit').disabled = true;
        try {
          const payload = draft.map((x) => (x.type === 'seat'
            ? { type: 'seat', aircon: !!x.aircon, number: x.number ?? null }
            : { type: x.type, aircon: !!x.aircon }));
          await authApi('/api/results', { classId, action: 'save-manual', grid: payload });
          ST.dirty = false;
          renderClassBody(classId, 'seating');
        } catch (e) {
          setMsg(errEl, e.message);
          q('#saveEdit').disabled = false;
        }
      };
    }
  }

  function swap(i, j) {
    const A = draft[i], B = draft[j];
    if (!A || !B || A.type !== 'seat' || B.type !== 'seat') return;
    if (A.number == null && B.number == null) return;
    [A.number, B.number] = [B.number, A.number];
    [A.name, B.name] = [B.name, A.name];
    changed = true;
    ST.dirty = true;
  }
  paintResult();

  // 이력
  const histCard = el(`
    <div class="card">
      <h2>배치 이력</h2>
      <p class="muted">최근 20개까지 보관됩니다. '보기'로 과거 좌석표를 확인하고, '복원'하면 그 배치가 현재 결과가 됩니다.</p>
      <div id="histList"></div>
      <div id="histPreview"></div>
    </div>
  `);
  host.appendChild(histCard);
  const list = histCard.querySelector('#histList');
  if (ST.history.length === 0) list.innerHTML = '<p class="muted">저장된 이력이 없습니다.</p>';
  ST.history.forEach((h) => {
    const isCur = ST.result && ST.result.historyId === h.id;
    const row = el(`
      <div class="hist-row">
        <div>
          <strong>${esc(fmtTime(h.createdAt))}</strong><span class="tag">${esc(h.label || '자동 배치')}</span>${isCur ? '<span class="tag cur">현재</span>' : ''}
          <div class="muted">점수 ${Math.round(h.score)}${(h.warnings || []).length ? ` · 경고 ${h.warnings.length}건` : ''}</div>
        </div>
        <div class="row">
          <button class="secondary tiny" data-a="view">보기</button>
          <button class="tiny" data-a="restore" ${isCur ? 'disabled' : ''}>복원</button>
        </div>
      </div>
    `);
    row.querySelector('[data-a="view"]').onclick = () => {
      const pv = histCard.querySelector('#histPreview');
      pv.innerHTML = '';
      const box = el(`<div style="margin-top:14px;"><div class="row" style="justify-content:space-between;"><strong>${esc(fmtTime(h.createdAt))} · ${esc(h.label || '자동 배치')}</strong><span class="row"><button class="secondary tiny" data-a="png">PNG</button><button class="secondary tiny" data-a="close">닫기</button></span></div></div>`);
      box.appendChild(mapEl(h.cols, h.grid, {
        cell: (cell) => (cell.type === 'seat'
          ? { html: `<div class="name">${esc(cell.name || '-')}</div><div class="num">${esc(cell.number || '')}</div>` }
          : {}),
      }));
      box.querySelector('[data-a="png"]').onclick = () => exportPNG(h, c.name);
      box.querySelector('[data-a="close"]').onclick = () => { pv.innerHTML = ''; };
      pv.appendChild(box);
    };
    row.querySelector('[data-a="restore"]').onclick = async () => {
      if (!confirm('이 배치를 현재 결과로 복원할까요? (현재 결과는 이력에 남아 있습니다)')) return;
      try {
        await authApi('/api/results', { classId, action: 'restore', historyId: h.id });
        renderClassBody(classId, 'seating');
      } catch (e) { alert(e.message); }
    };
    list.appendChild(row);
  });
}

// ────────────────────────────────────────────────────────────
// 학생 인증 — 반코드 + 번호 + PIN → 커스텀 토큰
// ────────────────────────────────────────────────────────────
function renderStudentAuth() {
  app.innerHTML = '';
  const wrap = el(`
    <div style="max-width:360px;">
      <a href="#" class="back" id="back">← 뒤로</a>
      <h1 style="margin-top:14px;">학생 로그인</h1>
      <div class="card">
        <label>반 코드</label>
        <input id="classId" placeholder="선생님께 받은 반 코드" />
        <label>번호</label>
        <input id="number" type="number" placeholder="예: 3" />
        <label>PIN (4자리)</label>
        <input id="pin" type="password" maxlength="4" placeholder="0000" />
        <button id="login" style="margin-top:14px;">로그인</button>
        <div class="error" id="err" style="display:none;"></div>
      </div>
    </div>
  `);
  app.appendChild(wrap);
  document.getElementById('back').onclick = (e) => { e.preventDefault(); renderLanding(); };
  document.getElementById('login').onclick = async () => {
    const classId = document.getElementById('classId').value.trim();
    const number = document.getElementById('number').value.trim();
    const pin = document.getElementById('pin').value.trim();
    const errEl = document.getElementById('err');
    errEl.style.display = 'none';
    try {
      const res = await api('/api/student-login', { classId, number, pin });
      await signInWithCustomToken(auth, res.token);
      // onAuthStateChanged가 render()를 자동 호출함
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    }
  };
}

// ────────────────────────────────────────────────────────────
// 학생 — 본인 정보 입력 폼 (+ 좌석표에서 선호 좌석 선택)
// ────────────────────────────────────────────────────────────
async function renderStudent() {
  app.innerHTML = '불러오는 중...';
  const { classId, number } = _studentClaims;
  const ref = doc(db, 'classes', classId, 'students', number);
  const [snap, classSnap] = await Promise.all([getDoc(ref), getDoc(doc(db, 'classes', classId)).catch(() => null)]);
  const s = snap.exists() ? snap.data() : {};
  const cls = classSnap && classSnap.exists() ? classSnap.data() : null;
  const hasMap = !!(cls && Array.isArray(cls.grid) && cls.cols);
  let pref = typeof s.preferredSeat === 'string' ? s.preferredSeat : '';

  app.innerHTML = '';
  const wrap = el(`
    <div style="max-width:560px;">
      <div class="row" style="justify-content:space-between;">
        <h1>${esc(s.name)}님, 안녕하세요</h1>
        <button class="secondary" id="logout">로그아웃</button>
      </div>
      <p class="muted">입력하신 내용은 선생님이 볼 수 없으며, 배치 계산에만 사용됩니다.</p>
      ${cls && cls.archived ? '<p class="error">이 반은 보관되어 더 이상 수정할 수 없습니다.</p>' : ''}
      <div class="card">
        <label>MBTI</label>
        <input id="mbti" value="${esc(s.mbti)}" placeholder="예: INFP" />

        <label>시력 (1=매우 나쁨 ~ 5=매우 좋음)</label>
        <select id="eyesight">
          ${[1,2,3,4,5].map((n) => `<option value="${n}" ${s.eyesight == n ? 'selected' : ''}>${n}</option>`).join('')}
        </select>

        <label>성적 (숫자, 학교 기준에 맞게)</label>
        <input id="grade" type="number" value="${esc(s.grade)}" />

        <label>키 (cm)</label>
        <input id="height" type="number" value="${esc(s.height)}" />

        <label>선호 위치</label>
        <select id="preferredLocation">
          <option value="">상관없음</option>
          <option value="front" ${s.preferredLocation === 'front' ? 'selected' : ''}>앞</option>
          <option value="middle" ${s.preferredLocation === 'middle' ? 'selected' : ''}>중간</option>
          <option value="back" ${s.preferredLocation === 'back' ? 'selected' : ''}>뒤</option>
        </select>

        <div id="seatPick" ${hasMap ? '' : 'style="display:none;"'}>
          <label>선호 좌석 (선택) — 앉고 싶은 자리를 눌러 1곳을 고르세요</label>
          <p class="muted" style="margin:0;">금색 테두리는 에어컨 가까운 자리입니다. 반드시 그 자리가 배정되는 것은 아니고, 가까울수록 유리하게 반영됩니다.</p>
          <div id="seatMap"></div>
          <button class="secondary" id="clearSeat" style="padding:6px 12px; font-size:12px;">선택 해제</button>
          <span id="seatLabel" class="muted" style="margin-left:8px;"></span>
        </div>

        <label>에어컨 선호</label>
        <select id="aircon">
          <option value="">상관없음</option>
          <option value="near" ${s.aircon === 'near' ? 'selected' : ''}>가까이</option>
          <option value="far" ${s.aircon === 'far' ? 'selected' : ''}>멀리</option>
        </select>

        <label>활동성 (1=조용함 ~ 5=매우 활발함)</label>
        <select id="activity">
          ${[1,2,3,4,5].map((n) => `<option value="${n}" ${s.activity == n ? 'selected' : ''}>${n}</option>`).join('')}
        </select>

        <label>선호하는 짝꿍 번호 (최대 3명, 1지망부터 콤마로 구분)</label>
        <input id="preferredMates" value="${esc((s.preferredMates || []).join(', '))}" placeholder="예: 5, 12, 7" />

        <label>기피하는 짝꿍 번호</label>
        <input id="avoidedMate" value="${esc(s.avoidedMate)}" placeholder="예: 9" />

        <label>선생님께 하고 싶은 말 (선택)</label>
        <textarea id="memo">${esc(s.memo)}</textarea>

        <button id="save" style="margin-top:14px;">저장</button>
        <span id="saveStatus" class="muted" style="margin-left:8px;"></span>
      </div>
    </div>
  `);
  app.appendChild(wrap);

  // 선호 좌석 지도: 선택값은 "행,열" 문자열로 저장 (좌석표 크기가 바뀌어도 같은 위치를 가리킴)
  function paintSeatMap() {
    if (!hasMap) return;
    const host = wrap.querySelector('#seatMap');
    host.innerHTML = '';
    host.appendChild(mapEl(cls.cols, cls.grid, {
      cell: (cell, i) => {
        if (cell.type !== 'seat') return {};
        const key = `${Math.floor(i / cls.cols)},${i % cls.cols}`;
        const on = key === pref;
        return { clickable: true, cls: on ? 'selected' : '', html: on ? '<div class="name">★</div><div class="num">내 선택</div>' : '' };
      },
      onClick: (i) => {
        const key = `${Math.floor(i / cls.cols)},${i % cls.cols}`;
        pref = pref === key ? '' : key;
        paintSeatMap();
      },
    }));
    if (pref) {
      const [r, cc] = pref.split(',').map(Number);
      wrap.querySelector('#seatLabel').textContent = `선택: ${r + 1}행 ${cc + 1}열`;
    } else {
      wrap.querySelector('#seatLabel').textContent = '선택 안 함';
    }
  }
  if (hasMap) {
    wrap.querySelector('#clearSeat').onclick = () => { pref = ''; paintSeatMap(); };
    paintSeatMap();
  }

  document.getElementById('logout').onclick = () => signOut(auth);
  document.getElementById('save').onclick = async () => {
    const mates = document.getElementById('preferredMates').value
      .split(',').map((x) => x.trim()).filter(Boolean).slice(0, 3);
    const payload = {
      mbti: document.getElementById('mbti').value.trim().toUpperCase(),
      eyesight: Number(document.getElementById('eyesight').value),
      grade: Number(document.getElementById('grade').value) || null,
      height: Number(document.getElementById('height').value) || null,
      preferredLocation: document.getElementById('preferredLocation').value,
      preferredSeat: pref || null,
      aircon: document.getElementById('aircon').value,
      activity: Number(document.getElementById('activity').value),
      preferredMates: mates,
      avoidedMate: document.getElementById('avoidedMate').value.trim(),
      memo: document.getElementById('memo').value,
      submitted: true,
      updatedAt: new Date().toISOString(),
    };
    const status = document.getElementById('saveStatus');
    try {
      await updateDoc(ref, payload);
      status.textContent = '저장되었습니다';
    } catch (e) {
      status.textContent = '저장 실패: ' + e.message;
    }
  };
}
</script>
</body>
</html>
