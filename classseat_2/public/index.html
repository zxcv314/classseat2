<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>자리배치</title>
<style>
  :root {
    --board: #1f3a2e;
    --board-light: #2b4d3c;
    --chalk: #f4f1e6;
    --chalk-dim: #cdd6cc;
    --accent: #e8c15a;
    --accent-dim: #b99a3f;
    --danger: #d97164;
    --line: rgba(244, 241, 230, 0.16);
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--board);
    color: var(--chalk);
    font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.55;
  }
  #app { max-width: 960px; margin: 0 auto; padding: 40px 20px 80px; }

  h1, h2, h3 { font-weight: 600; letter-spacing: -0.01em; margin: 0 0 6px; }
  h1 { font-size: 26px; }
  h2 { font-size: 19px; }
  h3 { font-size: 15px; color: var(--chalk-dim); font-weight: 500; }
  p { color: var(--chalk-dim); }
  .muted { color: var(--chalk-dim); font-size: 13px; }

  .card {
    background: var(--board-light);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }

  label { display: block; font-size: 13px; color: var(--chalk-dim); margin: 14px 0 5px; }
  input, select, textarea {
    width: 100%;
    padding: 9px 11px;
    background: rgba(0,0,0,0.18);
    border: 1px solid var(--line);
    color: var(--chalk);
    border-radius: var(--radius);
    font-size: 14px;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent-dim);
  }
  textarea { resize: vertical; min-height: 60px; }

  button {
    font-family: inherit;
    font-size: 14px;
    border: none;
    border-radius: var(--radius);
    padding: 10px 18px;
    cursor: pointer;
    background: var(--accent);
    color: #1a1a12;
    font-weight: 600;
  }
  button:hover { background: #f0cd6d; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--chalk);
    font-weight: 500;
  }
  button.secondary:hover { border-color: var(--chalk-dim); }
  button.danger { background: var(--danger); color: #2a0d0a; }
  button.link { background: none; padding: 0; color: var(--accent); font-weight: 500; text-decoration: underline; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .tabs button { background: transparent; color: var(--chalk-dim); border: 1px solid var(--line); }
  .tabs button.active { background: var(--accent); color: #1a1a12; border-color: var(--accent); }

  .error { color: var(--danger); font-size: 13px; margin-top: 8px; }
  .success { color: #8fd0a5; font-size: 13px; margin-top: 8px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--chalk-dim); font-weight: 500; }

  .class-list { display: flex; flex-direction: column; gap: 8px; }
  .class-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; background: rgba(0,0,0,0.14); border-radius: var(--radius);
    cursor: pointer; border: 1px solid transparent;
  }
  .class-item:hover { border-color: var(--line); }

  .seat-grid { display: grid; gap: 6px; margin: 16px 0; }
  .seat {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-size: 12px;
    text-align: center;
    padding: 4px;
  }
  .seat.aisle { background: transparent; border: none; }
  .seat.aircon { border-color: var(--accent-dim); }
  .seat .name { font-weight: 600; font-size: 13px; }
  .seat .num { color: var(--chalk-dim); font-size: 10px; }

  .weight-row { display: grid; grid-template-columns: 110px 1fr 40px; gap: 10px; align-items: center; margin-bottom: 8px; }
  .weight-row input[type=range] { width: 100%; }
  .weight-row span { text-align: right; font-size: 13px; color: var(--chalk-dim); }

  .pin-table td:last-child { font-family: monospace; letter-spacing: 0.05em; color: var(--accent); }

  a.back { color: var(--chalk-dim); font-size: 13px; text-decoration: none; }
  a.back:hover { color: var(--chalk); }

  .score-badge {
    display: inline-block; background: rgba(232,193,90,0.15); color: var(--accent);
    padding: 3px 10px; border-radius: 20px; font-size: 13px; font-weight: 600;
  }

  /* 결과 좌석표: 사물함, 에어컨 표시 */
  .seat.locker {
    background: rgba(232,193,90,0.08); border-color: var(--accent-dim);
    color: var(--chalk-dim); font-size: 10px;
  }
  .seat.aircon { position: relative; }
  .seat.aircon::after {
    content: "❄"; position: absolute; top: 2px; right: 4px;
    font-size: 10px; color: var(--accent);
  }

  /* 교실 배치도 편집기 */
  button.secondary.active {
    background: rgba(232,193,90,0.16); border-color: var(--accent); color: var(--accent);
  }
  .board-bar {
    background: rgba(0,0,0,0.28); border: 1px solid var(--line); border-radius: var(--radius);
    color: var(--chalk-dim); text-align: center; letter-spacing: 0.5em;
    font-size: 12px; padding: 6px 0; margin-bottom: 8px;
  }
  .editor-wrap { overflow-x: auto; padding-bottom: 6px; }
  .editor-inner { display: inline-block; }
  .edit-grid { --cell: 56px; display: grid; gap: 6px; }
  .cell {
    width: var(--cell); height: 46px; position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--chalk-dim);
    background: rgba(0,0,0,0.2); border: 1px solid var(--line); border-radius: var(--radius);
    cursor: pointer; user-select: none;
  }
  .cell:hover { border-color: var(--chalk-dim); }
  .cell.seat { color: var(--chalk); }
  .cell.aisle {
    background: repeating-linear-gradient(135deg, rgba(244,241,230,0.07) 0 5px, transparent 5px 10px);
    border-style: dashed;
  }
  .cell.locker { background: rgba(232,193,90,0.1); border-color: var(--accent-dim); color: var(--accent); }
  .cell.ac { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .cell.ac::after { content: "❄"; position: absolute; top: 2px; right: 4px; font-size: 10px; color: var(--accent); }

  .ctx-menu {
    position: fixed; z-index: 300; min-width: 170px;
    background: var(--board-light); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); overflow: hidden;
  }
  .ctx-item { padding: 9px 14px; font-size: 13px; cursor: pointer; }
  .ctx-item:hover { background: rgba(232,193,90,0.15); color: var(--accent); }
</style>
</head>
<body>
<div id="app">불러오는 중...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signOut, onAuthStateChanged, signInWithCustomToken
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc,
  onSnapshot, updateDoc, query, where
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ── Firebase 프로젝트 설정: 본인 프로젝트 값으로 교체하세요 ──
const firebaseConfig = {
  apiKey: "AIzaSyAOKhgT1fHeNs0wIhjc6rcjqCgjcX7FcFk",
  authDomain: "classseat-c7328.firebaseapp.com",
  projectId: "classseat-c7328",
  storageBucket: "classseat-c7328.firebasestorage.app",
  messagingSenderId: "100599928392",
  appId: "1:100599928392:web:af72a41e571def1511aa7d",
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const app = document.getElementById('app');

let _role = null;       // 'teacher' | 'student' | null
let _studentClaims = null; // { classId, number } — 학생 로그인 시 커스텀 클레임 저장
let _selectedClassId = null;

// ── 서버 API 호출 헬퍼 ──
async function api(path, body, idToken) {
  const r = await fetch(path, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      ...(idToken ? { Authorization: 'Bearer ' + idToken } : {}),
    },
    body: JSON.stringify(body || {}),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || '요청에 실패했습니다');
  return data;
}

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

// ────────────────────────────────────────────────────────────
// 라우터
// ────────────────────────────────────────────────────────────
function render() {
  if (!auth.currentUser) { renderLanding(); return; }
  if (_role === 'teacher') renderTeacher();
  else if (_role === 'student') renderStudent();
  else renderLanding();
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    _role = null;
    render();
    return;
  }
  // 커스텀 토큰으로 로그인한 학생인지, 일반 이메일 로그인 선생님인지 구분
  const idTokenResult = await user.getIdTokenResult();
  if (idTokenResult.claims.role === 'student') {
    _role = 'student';
    _studentClaims = { classId: idTokenResult.claims.classId, number: idTokenResult.claims.number };
  } else {
    _role = 'teacher';
  }
  render();
});

// ────────────────────────────────────────────────────────────
// 랜딩 — 선생님/학생 선택
// ────────────────────────────────────────────────────────────
function renderLanding() {
  app.innerHTML = '';
  app.appendChild(el(`
    <div>
      <h1>학급 자리배치</h1>
      <p class="muted">선생님은 반을 관리하고 배치를 실행합니다. 학생은 본인 정보만 입력합니다.</p>
      <div class="row" style="margin-top:24px;">
        <div class="card" style="flex:1; min-width:220px; cursor:pointer;" id="goTeacher">
          <h2>선생님</h2>
          <p class="muted">반 생성, 학생 계정 발급, 배치 실행</p>
        </div>
        <div class="card" style="flex:1; min-width:220px; cursor:pointer;" id="goStudent">
          <h2>학생</h2>
          <p class="muted">번호 + PIN으로 로그인, 정보 입력</p>
        </div>
      </div>
    </div>
  `));
  document.getElementById('goTeacher').onclick = () => renderTeacherAuth();
  document.getElementById('goStudent').onclick = () => renderStudentAuth();
}

// ────────────────────────────────────────────────────────────
// 선생님 인증 — 일반 Firebase Auth (이메일/비밀번호)
// ────────────────────────────────────────────────────────────
function renderTeacherAuth(mode = 'login') {
  app.innerHTML = '';
  const wrap = el(`
    <div style="max-width:380px;">
      <a href="#" class="back" id="back">← 뒤로</a>
      <h1 style="margin-top:14px;">선생님 ${mode === 'login' ? '로그인' : '회원가입'}</h1>
      <div class="tabs">
        <button id="tabLogin" class="${mode === 'login' ? 'active' : ''}">로그인</button>
        <button id="tabSignup" class="${mode === 'signup' ? 'active' : ''}">회원가입</button>
      </div>
      <div class="card">
        <label>이메일</label>
        <input type="email" id="email" placeholder="teacher@school.ac.kr" />
        <label>비밀번호</label>
        <input type="password" id="pw" placeholder="6자 이상" />
        <div style="margin-top:16px;">
          <button id="submit">${mode === 'login' ? '로그인' : '가입하기'}</button>
        </div>
        <div class="error" id="err" style="display:none;"></div>
      </div>
    </div>
  `);
  app.appendChild(wrap);
  document.getElementById('back').onclick = (e) => { e.preventDefault(); renderLanding(); };
  document.getElementById('tabLogin').onclick = () => renderTeacherAuth('login');
  document.getElementById('tabSignup').onclick = () => renderTeacherAuth('signup');
  document.getElementById('submit').onclick = async () => {
    const email = document.getElementById('email').value.trim();
    const pw = document.getElementById('pw').value;
    const errEl = document.getElementById('err');
    errEl.style.display = 'none';
    try {
      if (mode === 'login') await signInWithEmailAndPassword(auth, email, pw);
      else await createUserWithEmailAndPassword(auth, email, pw);
      // onAuthStateChanged가 render()를 자동 호출함
    } catch (e) {
      errEl.textContent = e.message.replace('Firebase: ', '');
      errEl.style.display = 'block';
    }
  };
}

// ────────────────────────────────────────────────────────────
// 선생님 — 반 목록 / 반 생성
// ────────────────────────────────────────────────────────────
async function renderTeacher() {
  app.innerHTML = '불러오는 중...';
  const uid = auth.currentUser.uid;

  let myClasses = [];
  try {
    // where 조건 없이 컬렉션 전체를 읽으면 Firestore 규칙이 쿼리 자체를 거부한다
    const q = query(collection(db, 'classes'), where('teacherUid', '==', uid));
    const snap = await getDocs(q);
    myClasses = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  } catch (e) {
    app.innerHTML = '';
    app.appendChild(el(`<div class="card"><p class="error">반 목록을 불러오지 못했습니다: ${e.message}</p></div>`));
    return;
  }

  app.innerHTML = '';
  const header = el(`
    <div class="row" style="justify-content:space-between; margin-bottom:20px;">
      <h1>내 학급</h1>
      <button class="secondary" id="logout">로그아웃</button>
    </div>
  `);
  app.appendChild(header);
  document.getElementById('logout').onclick = () => signOut(auth);

  if (myClasses.length === 0) {
    // 반이 0개면 처음부터 생성 폼을 보여준다 (드롭다운 옵션 하나뿐이라 onchange 안 불리는 버그 회피)
    renderNewClassForm();
    return;
  }

  const list = el(`<div class="card"><h2>반 목록</h2><div class="class-list" id="list"></div></div>`);
  app.appendChild(list);
  const listEl = list.querySelector('#list');
  myClasses.forEach((c) => {
    const item = el(`
      <div class="class-item">
        <div><strong>${c.name || '(이름 없음)'}</strong><div class="muted">코드: ${c.id}</div></div>
        <span class="muted">${Object.keys(c.roster || {}).length}명 →</span>
      </div>
    `);
    item.onclick = () => renderClassBody(c.id);
    listEl.appendChild(item);
  });

  const newBtn = el(`<button id="newClass" style="margin-top:4px;">+ 새 반 만들기</button>`);
  app.appendChild(newBtn);
  document.getElementById('newClass').onclick = () => renderNewClassForm();
}

function renderNewClassForm() {
  app.innerHTML = '';
  const wrap = el(`
    <div>
      <a href="#" class="back" id="back">← 반 목록</a>
      <h1 style="margin-top:14px;">새 반 만들기</h1>
      <div class="card" style="max-width:420px;">
        <label>반 이름</label>
        <input id="name" placeholder="예: 2학년 3반" />
        <div class="row">
          <div style="flex:1;">
            <label>가로 좌석 수 (열)</label>
            <input id="cols" type="number" value="6" min="1" />
          </div>
          <div style="flex:1;">
            <label>세로 좌석 수 (행)</label>
            <input id="rows" type="number" value="5" min="1" />
          </div>
        </div>
        <p class="muted" style="margin-top:10px;">교실 배치도(통로, 에어컨 위치)는 반 생성 후 화면에서 세부 설정할 수 있습니다.</p>
        <button id="create" style="margin-top:8px;">반 만들기</button>
        <div class="error" id="err" style="display:none;"></div>
      </div>
    </div>
  `);
  app.appendChild(wrap);
  document.getElementById('back').onclick = (e) => { e.preventDefault(); renderTeacher(); };
  document.getElementById('create').onclick = async () => {
    const name = document.getElementById('name').value.trim();
    const cols = parseInt(document.getElementById('cols').value, 10);
    const rows = parseInt(document.getElementById('rows').value, 10);
    const errEl = document.getElementById('err');
    if (!name || !cols || !rows) {
      errEl.textContent = '모든 값을 입력해주세요';
      errEl.style.display = 'block';
      return;
    }
    const grid = Array.from({ length: rows * cols }, () => ({ type: 'seat', aircon: false }));
    const classId = (name.replace(/\s+/g, '') + '-' + Math.random().toString(36).slice(2, 6)).toLowerCase();
    try {
      await setDoc(doc(db, 'classes', classId), {
        teacherUid: auth.currentUser.uid,
        name, rows, cols, grid,
        roster: {},
        constraints: { blacklist: [], whitelist: [], fixedSeats: {} },
        weights: { location: 5, aircon: 3, mates: 6, personality: 3, grade: 4, height: 4, activity: 3 },
      });
      renderClassBody(classId);
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    }
  };
}

// ────────────────────────────────────────────────────────────
// 선생님 — 교실 배치도 편집기
//  · 클릭: 좌석 → 통로 → 사물함 순환 / Shift+클릭 또는 ❄ 모드: 에어컨 표시 / 우클릭: 메뉴
//  · 변경은 0.6초 뒤 자동 저장. 배치 실행 전에는 반드시 저장을 마친다(서버가 Firestore의 grid를 읽기 때문).
//  · 좌석 키 = 행우선 인덱스(String(r*cols+c)). constraints.fixedSeats도 이 키를 쓰므로
//    크기 변경/칸 종류 변경 시 함께 옮기거나 해제한다.
// ────────────────────────────────────────────────────────────
const GRID_MAX = 14;
const CELL_CYCLE = ['seat', 'aisle', 'locker'];
const CELL_LABEL = { seat: '좌석', aisle: '통로', locker: '사물함' };
let _ge = null; // 현재 열려 있는 편집기 상태

window.addEventListener('beforeunload', (e) => {
  if (_ge && _ge.dirty) { e.preventDefault(); e.returnValue = ''; }
});

function mountGridEditor(classId, c) {
  const rows = c.rows || 5;
  const cols = c.cols || 6;
  const gridValid = Array.isArray(c.grid) && c.grid.length === rows * cols;
  const normalize = (x) => {
    const type = CELL_CYCLE.includes(x && x.type) ? x.type : 'seat';
    return { type, aircon: type === 'seat' && !!(x && x.aircon) };
  };

  const ge = {
    classId, rows, cols,
    grid: gridValid
      ? c.grid.map(normalize)
      : Array.from({ length: rows * cols }, () => ({ type: 'seat', aircon: false })),
    fixedSeats: { ...((c.constraints && c.constraints.fixedSeats) || {}) },
    rosterCount: Object.keys(c.roster || {}).length,
    acMode: false,
    dirty: false,
    fixedDirty: false,   // fixedSeats가 편집기에서 바뀐 경우에만 함께 저장 (다른 제약 UI와 덮어쓰기 충돌 방지)
    timer: null,
    chain: Promise.resolve(),
  };
  _ge = ge;

  const card = el(`
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <h2>교실 배치도</h2>
        <span class="muted" id="geStatus"></span>
      </div>
      <p class="muted">칸을 클릭하면 좌석 → 통로 → 사물함 순으로 바뀝니다. Shift+클릭이나 ❄ 모드로 에어컨 인근 좌석을 표시하고, 우클릭으로 메뉴를 엽니다. 위쪽이 칠판(앞)입니다.</p>
      <div class="row" style="align-items:flex-end; margin:10px 0;">
        <div style="width:88px;">
          <label style="margin-top:0;">열 (가로)</label>
          <input id="geCols" type="number" min="1" max="${GRID_MAX}" value="${cols}" />
        </div>
        <div style="width:88px;">
          <label style="margin-top:0;">행 (세로)</label>
          <input id="geRows" type="number" min="1" max="${GRID_MAX}" value="${rows}" />
        </div>
        <button class="secondary" id="geResize">크기 적용</button>
        <button class="secondary" id="geAc">❄ 에어컨 모드</button>
        <button class="secondary" id="geSaveBtn">지금 저장</button>
      </div>
      <div class="editor-wrap">
        <div class="editor-inner">
          <div class="board-bar">칠 판</div>
          <div class="edit-grid" id="geGrid"></div>
        </div>
      </div>
      <div id="geSummary" class="muted" style="margin-top:10px;"></div>
      <div class="error" id="geErr" style="display:none;"></div>
    </div>
  `);
  app.appendChild(card);

  const gridEl = card.querySelector('#geGrid');
  const errEl = card.querySelector('#geErr');

  const setStatus = (text, isErr) => {
    if (_ge !== ge) return; // 다른 반으로 이동한 뒤 늦게 도착한 상태 갱신은 무시
    const s = card.querySelector('#geStatus');
    s.textContent = text;
    s.style.color = isErr ? 'var(--danger)' : '';
  };

  const render = () => {
    gridEl.style.gridTemplateColumns = `repeat(${ge.cols}, var(--cell))`;
    gridEl.innerHTML = ge.grid
      .map((cell, i) => `<div class="cell ${cell.type}${cell.aircon ? ' ac' : ''}" data-i="${i}">${CELL_LABEL[cell.type]}</div>`)
      .join('');
    const seats = ge.grid.filter((x) => x.type === 'seat').length;
    const short = ge.rosterCount > seats;
    const sum = card.querySelector('#geSummary');
    sum.className = short ? 'error' : 'muted';
    sum.textContent = `좌석 ${seats}석 · 등록 학생 ${ge.rosterCount}명` + (short ? ' — 좌석이 학생 수보다 적습니다' : '');
  };

  // ── 저장 ──
  const saveNow = () => {
    clearTimeout(ge.timer);
    ge.chain = ge.chain.then(async () => {
      if (!ge.dirty) return;
      ge.dirty = false;
      const payload = {
        rows: ge.rows,
        cols: ge.cols,
        grid: ge.grid.map((x) => ({ type: x.type, aircon: x.aircon })),
      };
      const withFixed = ge.fixedDirty;
      if (withFixed) { payload['constraints.fixedSeats'] = { ...ge.fixedSeats }; ge.fixedDirty = false; }
      setStatus('저장 중...');
      try {
        await updateDoc(doc(db, 'classes', ge.classId), payload);
        setStatus('저장됨');
      } catch (e) {
        ge.dirty = true;
        if (withFixed) ge.fixedDirty = true;
        setStatus('저장 실패: ' + e.message, true);
      }
    });
    return ge.chain;
  };
  const markDirty = () => {
    ge.dirty = true;
    setStatus('저장 대기 중...');
    clearTimeout(ge.timer);
    ge.timer = setTimeout(saveNow, 600);
  };
  // 배치 실행 직전에 호출: 저장이 끝났고 실패가 없어야 통과
  ge.flush = async () => {
    if (ge.dirty) await saveNow(); else await ge.chain;
    if (ge.dirty) throw new Error('배치도를 저장하지 못해 배치를 실행할 수 없습니다. 네트워크를 확인하고 "지금 저장"을 눌러주세요.');
  };

  // ── 칸 편집 ──
  const setType = (i, type) => {
    const cell = ge.grid[i];
    cell.type = type;
    if (type !== 'seat') {
      cell.aircon = false;
      if (ge.fixedSeats[String(i)] !== undefined) { delete ge.fixedSeats[String(i)]; ge.fixedDirty = true; }
    }
  };

  gridEl.addEventListener('click', (e) => {
    const t = e.target.closest('[data-i]');
    if (!t) return;
    const i = Number(t.dataset.i);
    const cell = ge.grid[i];
    if (e.shiftKey || ge.acMode) {
      if (cell.type !== 'seat') return;
      cell.aircon = !cell.aircon;
    } else {
      setType(i, CELL_CYCLE[(CELL_CYCLE.indexOf(cell.type) + 1) % CELL_CYCLE.length]);
    }
    render();
    markDirty();
  });

  // ── 우클릭 메뉴 ──
  const closeMenu = () => { const m = document.getElementById('geMenu'); if (m) m.remove(); };
  gridEl.addEventListener('contextmenu', (e) => {
    const t = e.target.closest('[data-i]');
    if (!t) return;
    e.preventDefault();
    closeMenu();
    const i = Number(t.dataset.i);
    const cell = ge.grid[i];
    const items = [['seat', '🪑 좌석으로'], ['aisle', '🚶 통로로'], ['locker', '🗄️ 사물함으로']];
    if (cell.type === 'seat') items.push(['ac', cell.aircon ? '❄ 에어컨 표시 해제' : '❄ 에어컨 인근 표시']);
    const menu = el(`<div class="ctx-menu" id="geMenu">${items.map(([k, l]) => `<div class="ctx-item" data-k="${k}">${l}</div>`).join('')}</div>`);
    menu.style.left = Math.max(0, Math.min(e.clientX, window.innerWidth - 190)) + 'px';
    menu.style.top = Math.max(0, Math.min(e.clientY, window.innerHeight - 40 * items.length - 10)) + 'px';
    menu.addEventListener('click', (ev) => {
      const k = ev.target.dataset.k;
      if (!k) return;
      if (k === 'ac') cell.aircon = !cell.aircon; else setType(i, k);
      closeMenu();
      render();
      markDirty();
    });
    document.body.appendChild(menu);
    setTimeout(() => document.addEventListener('click', closeMenu, { once: true }), 0);
  });

  // ── 크기 변경 ──
  card.querySelector('#geResize').onclick = () => {
    errEl.style.display = 'none';
    const nc = parseInt(card.querySelector('#geCols').value, 10);
    const nr = parseInt(card.querySelector('#geRows').value, 10);
    if (!(nc >= 1 && nc <= GRID_MAX && nr >= 1 && nr <= GRID_MAX)) {
      errEl.textContent = `행과 열은 1~${GRID_MAX} 사이의 숫자로 입력해주세요`;
      errEl.style.display = 'block';
      return;
    }
    if (nc === ge.cols && nr === ge.rows) return;

    const oldR = ge.rows, oldC = ge.cols;
    const newGrid = Array.from({ length: nr * nc }, (_, i) => {
      const r = Math.floor(i / nc), cc = i % nc;
      return r < oldR && cc < oldC ? ge.grid[r * oldC + cc] : { type: 'seat', aircon: false };
    });

    // 열 수가 바뀌면 좌석 키(인덱스)가 달라지므로 고정석을 새 좌표로 옮긴다
    const oldFixed = ge.fixedSeats;
    const newFixed = {};
    let dropped = 0;
    Object.entries(oldFixed).forEach(([key, studentId]) => {
      const idx = Number(key), r = Math.floor(idx / oldC), cc = idx % oldC;
      if (r < nr && cc < nc && newGrid[r * nc + cc].type === 'seat') newFixed[String(r * nc + cc)] = studentId;
      else dropped++;
    });
    if (dropped && !confirm(`줄어드는 범위에 있는 고정 좌석 ${dropped}개가 해제됩니다. 계속할까요?`)) return;

    ge.rows = nr;
    ge.cols = nc;
    ge.grid = newGrid;
    if (Object.keys(oldFixed).length) { ge.fixedSeats = newFixed; ge.fixedDirty = true; }
    render();
    markDirty();
  };

  // ── 에어컨 모드(Shift 키가 없는 터치 기기용) / 수동 저장 ──
  const acBtn = card.querySelector('#geAc');
  acBtn.onclick = () => {
    ge.acMode = !ge.acMode;
    acBtn.classList.toggle('active', ge.acMode);
  };
  card.querySelector('#geSaveBtn').onclick = () => {
    if (!ge.dirty) { setStatus('변경 사항이 없습니다'); return; }
    saveNow();
  };

  render();
  if (!gridValid) markDirty(); // 저장된 grid가 없거나 크기가 어긋난 반은 기본 배치도로 채워서 저장
  return ge;
}

// ────────────────────────────────────────────────────────────
// 선생님 — 반 상세: 학생 관리, 가중치, 배치 실행, 결과
// ────────────────────────────────────────────────────────────
async function renderClassBody(classId) {
  _selectedClassId = classId;
  app.innerHTML = '불러오는 중...';
  const snap = await getDoc(doc(db, 'classes', classId));
  if (!snap.exists()) { renderTeacher(); return; }
  const c = { id: classId, ...snap.data() };

  const resultSnap = await getDoc(doc(db, 'classes', classId, 'results', 'current')).catch(() => null);
  const result = resultSnap && resultSnap.exists() ? resultSnap.data() : null;

  app.innerHTML = '';
  app.appendChild(el(`
    <div>
      <a href="#" class="back" id="back">← 반 목록</a>
      <div class="row" style="justify-content:space-between; margin-top:14px;">
        <div><h1>${c.name}</h1><p class="muted">반 코드: <strong>${c.id}</strong> (학생에게 공유하세요)</p></div>
      </div>
    </div>
  `));
  document.getElementById('back').onclick = (e) => { e.preventDefault(); renderTeacher(); };

  // 학생 계정 생성
  const studentsCard = el(`
    <div class="card">
      <h2>학생 계정 생성</h2>
      <p class="muted">이름을 한 줄에 한 명씩 입력하면 번호와 PIN이 자동 발급됩니다. 현재 등록: ${Object.keys(c.roster || {}).length}명</p>
      <textarea id="names" placeholder="홍길동&#10;김철수&#10;이영희"></textarea>
      <button id="createStudents" style="margin-top:10px;">계정 생성</button>
      <div id="pinResult"></div>
      <div class="error" id="err1" style="display:none;"></div>
    </div>
  `);
  app.appendChild(studentsCard);
  document.getElementById('createStudents').onclick = async () => {
    const names = document.getElementById('names').value.split('\n').map((s) => s.trim()).filter(Boolean);
    const errEl = document.getElementById('err1');
    errEl.style.display = 'none';
    if (names.length === 0) return;
    try {
      const idToken = await auth.currentUser.getIdToken();
      const res = await api('/api/create-students', { classId, names }, idToken);
      const tbl = el(`
        <div>
          <p class="success">${res.created.length}명 생성 완료. PIN은 지금만 표시됩니다 — 캡처하거나 적어서 나눠주세요.</p>
          <table class="pin-table">
            <tr><th>번호</th><th>이름</th><th>PIN</th></tr>
            ${res.created.map((s) => `<tr><td>${s.number}</td><td>${s.name}</td><td>${s.pin}</td></tr>`).join('')}
          </table>
        </div>
      `);
      document.getElementById('pinResult').innerHTML = '';
      document.getElementById('pinResult').appendChild(tbl);
      document.getElementById('names').value = '';
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    }
  };

  // 제출 현황
  //const studentsSnap = await getDocs(collection(db, 'classes', classId, 'students')).catch(() => null);
  // 선생님은 students 서브컬렉션 읽기 권한이 없으므로(설계상 의도), roster 기준으로만 인원수를 표시한다.
  const statusCard = el(`
    <div class="card">
      <h2>제출 현황</h2>
      <p class="muted">등록 학생: ${Object.keys(c.roster || {}).length}명. 개인정보(MBTI, 성적, 선호짝꿍 등)는 선생님도 볼 수 없으며, 오직 배치 계산에만 사용됩니다.</p>
    </div>
  `);
  app.appendChild(statusCard);

  // 교실 배치도 편집기
  const ge = mountGridEditor(classId, c);

  // 가중치 슬라이더
  const w = c.weights || {};
  const weightLabels = [
    ['location', '선호 위치'], ['aircon', '에어컨'], ['mates', '선호 짝꿍'],
    ['personality', '성격 균형'], ['grade', '성적 균형'], ['height', '키 순서'], ['activity', '활동성 분산'],
  ];
  const weightsCard = el(`
    <div class="card">
      <h2>배치 가중치</h2>
      <p class="muted">각 항목이 배치 점수에서 얼마나 중요한지 조절합니다.</p>
      <div id="weightRows"></div>
      <button id="saveWeights" class="secondary" style="margin-top:6px;">가중치 저장</button>
    </div>
  `);
  app.appendChild(weightsCard);
  const wRows = weightsCard.querySelector('#weightRows');
  weightLabels.forEach(([key, label]) => {
    const val = w[key] ?? 3;
    const row = el(`
      <div class="weight-row">
        <label style="margin:0;">${label}</label>
        <input type="range" min="0" max="10" value="${val}" data-key="${key}" />
        <span>${val}</span>
      </div>
    `);
    const input = row.querySelector('input');
    const span = row.querySelector('span');
    input.oninput = () => { span.textContent = input.value; };
    wRows.appendChild(row);
  });
  document.getElementById('saveWeights').onclick = async () => {
    const newWeights = {};
    wRows.querySelectorAll('input').forEach((i) => { newWeights[i.dataset.key] = Number(i.value); });
    await updateDoc(doc(db, 'classes', classId), { weights: newWeights });
  };

  // 배치 실행
  const runCard = el(`
    <div class="card">
      <h2>배치 실행</h2>
      <p class="muted">정보를 입력 완료한 학생들을 대상으로 최적 좌석을 계산합니다. 최대 30초 정도 걸릴 수 있습니다.</p>
      <button id="runSeating">배치 실행</button>
      <span id="runStatus" class="muted" style="margin-left:10px;"></span>
      <div class="error" id="err2" style="display:none;"></div>
    </div>
  `);
  app.appendChild(runCard);
  document.getElementById('runSeating').onclick = async () => {
    const btn = document.getElementById('runSeating');
    const status = document.getElementById('runStatus');
    const errEl = document.getElementById('err2');
    errEl.style.display = 'none';
    btn.disabled = true;
    status.textContent = '계산 중...';
    try {
      await ge.flush(); // 서버는 Firestore에 저장된 배치도를 읽으므로 저장이 끝난 뒤에 실행
      const idToken = await auth.currentUser.getIdToken();
      await api('/api/run-seating', { classId }, idToken);
      status.textContent = '완료';
      renderClassBody(classId);
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
      status.textContent = '';
    } finally {
      btn.disabled = false;
    }
  };

  // 결과 좌석표
  if (result) {
    const resultCard = el(`
      <div class="card">
        <div class="row" style="justify-content:space-between;">
          <h2>최종 좌석 배치</h2>
          <span class="score-badge">점수 ${Math.round(result.score)}</span>
        </div>
        <div class="board-bar" style="margin-top:12px;">칠 판</div>
        <div class="seat-grid" id="seatGrid" style="grid-template-columns: repeat(${result.cols}, 1fr);"></div>
      </div>
    `);
    app.appendChild(resultCard);
    const grid = resultCard.querySelector('#seatGrid');
    result.grid.forEach((cell) => {
      if (cell.type === 'locker') {
        grid.appendChild(el(`<div class="seat locker">사물함</div>`));
        return;
      }
      if (cell.type !== 'seat') {
        grid.appendChild(el(`<div class="seat aisle"></div>`));
        return;
      }
      grid.appendChild(el(`
        <div class="seat ${cell.aircon ? 'aircon' : ''}">
          <div class="name">${cell.name || '-'}</div>
          <div class="num">${cell.number || ''}</div>
        </div>
      `));
    });
  }
}

// 학생 — 본인 정보 입력 폼
// ────────────────────────────────────────────────────────────
async function renderStudent() {
  app.innerHTML = '불러오는 중...';
  const { classId, number } = _studentClaims;
  const ref = doc(db, 'classes', classId, 'students', number);
  const snap = await getDoc(ref);
  const s = snap.exists() ? snap.data() : {};

  app.innerHTML = '';
  const wrap = el(`
    <div style="max-width:480px;">
      <div class="row" style="justify-content:space-between;">
        <h1>${s.name || ''}님, 안녕하세요</h1>
        <button class="secondary" id="logout">로그아웃</button>
      </div>
      <p class="muted">입력하신 내용은 선생님이 볼 수 없으며, 배치 계산에만 사용됩니다.</p>
      <div class="card">
        <label>MBTI</label>
        <input id="mbti" value="${s.mbti || ''}" placeholder="예: INFP" />

        <label>시력 (1=매우 나쁨 ~ 5=매우 좋음)</label>
        <select id="eyesight">
          ${[1,2,3,4,5].map((n) => `<option value="${n}" ${s.eyesight == n ? 'selected' : ''}>${n}</option>`).join('')}
        </select>

        <label>성적 (숫자, 학교 기준에 맞게)</label>
        <input id="grade" type="number" value="${s.grade ?? ''}" />

        <label>키 (cm)</label>
        <input id="height" type="number" value="${s.height ?? ''}" />

        <label>선호 위치</label>
        <select id="preferredLocation">
          <option value="">상관없음</option>
          <option value="front" ${s.preferredLocation === 'front' ? 'selected' : ''}>앞</option>
          <option value="middle" ${s.preferredLocation === 'middle' ? 'selected' : ''}>중간</option>
          <option value="back" ${s.preferredLocation === 'back' ? 'selected' : ''}>뒤</option>
        </select>

        <label>에어컨 선호</label>
        <select id="aircon">
          <option value="">상관없음</option>
          <option value="near" ${s.aircon === 'near' ? 'selected' : ''}>가까이</option>
          <option value="far" ${s.aircon === 'far' ? 'selected' : ''}>멀리</option>
        </select>

        <label>활동성 (1=조용함 ~ 5=매우 활발함)</label>
        <select id="activity">
          ${[1,2,3,4,5].map((n) => `<option value="${n}" ${s.activity == n ? 'selected' : ''}>${n}</option>`).join('')}
        </select>

        <label>선호하는 짝꿍 번호 (최대 3명, 1지망부터 콤마로 구분)</label>
        <input id="preferredMates" value="${(s.preferredMates || []).join(', ')}" placeholder="예: 5, 12, 7" />

        <label>기피하는 짝꿍 번호</label>
        <input id="avoidedMate" value="${s.avoidedMate || ''}" placeholder="예: 9" />

        <label>선생님께 하고 싶은 말 (선택)</label>
        <textarea id="memo">${s.memo || ''}</textarea>

  document.getElementById('logout').onclick = () => signOut(auth);
  document.getElementById('save').onclick = async () => {

      status.textContent = '저장되었습니다';
    } catch (e) {
      status.textContent = '저장 실패: ' + e.message;
    }
  };
}
</script>
